[project]
name = "live-node-monitor"
version = "0.1.0"
description = ""
authors = [{name = "Simon Rummert", email = "09.milieu.motes@icloud.com"}]
readme = "README.md"
requires-python = ">=3.15,<4.0"
dependencies = [
  "pydantic>=2.5.3,<3.0.0",
  "pyyaml>=6.0.1,<7.0.0",
  "aiofile>=3.8.8,<4.0.0",
  "elasticsearch[async]>=9.5.1,<9.6.0",
  "click>=8.1.7,<9.0.0",
]

[dependency-groups]
dev = [
  "ruff>=0.17.4,<0.18.0",
  "yamllint>=1.33.0,<2.0.0",
  "pytest>=7.1.3,<10.0.0",
  "pytest-asyncio>=1.0.0,<2.0.0",
  "isort>=9.0.0,<10.0.0",
  "pre-commit>=4.0.0,<5.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [
  "src"
]

[tool.isort]
profile = "black"

[tool.ruff.lint.per-file-ignores]
# Tests write to the monitored log file with plain blocking IO on purpose
"tests/**" = ["ASYNC230"]
